spring:
  application:
    name: scaffold-admin
  profiles:
    active: dev

server:
  # 内部端口：后端不直接对外，由 gateway/server.mjs 统一代理出去。
  # 选 18081 避开 8080 等高频冲突端口；可被启动脚本用 --server.port 覆盖。
  port: 18081

scaffold:
  api-prefix: /api
  jwt:
    secret: "${JWT_SECRET}"
    expires-seconds: 7200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
