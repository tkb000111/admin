spring:
  application:
    name: scaffold-admin
  profiles:
    active: dev

server:
  # 避开 8080（全世界开发者的默认端口，客户机器上极易冲突）。
  # 实际端口仍可由启动脚本探测占用后覆盖：--server.port=xxxx
  port: 18080

scaffold:
  api-prefix: /api
  jwt:
    secret: "${JWT_SECRET}"
    expires-seconds: 7200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
