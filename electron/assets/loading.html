<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>酷炫后台管理 — 正在启动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1418;
      color: #e8edf0;
      font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card { width: 420px; padding: 36px 40px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #82dd2d; box-shadow: 0 0 10px rgba(130, 221, 45, .6);
    }
    .name { font-size: 16px; font-weight: 700; letter-spacing: .01em; }
    h1 { font-size: 20px; font-weight: 650; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #8a959c; margin-bottom: 26px; }

    .steps { list-style: none; margin-bottom: 22px; }
    .step {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; font-size: 13px; color: #6b767d;
      transition: color .2s;
    }
    .step .mark {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid #3a444b; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: all .2s;
    }
    .step.active { color: #e8edf0; }
    .step.active .mark { border-color: #236de9; }
    .step.done { color: #8a959c; }
    .step.done .mark { border-color: #58a021; background: #58a021; color: #fff; }
    .step.failed .mark { border-color: #e0443b; background: #e0443b; color: #fff; }

    .bar { height: 4px; background: #1d2429; border-radius: 2px; overflow: hidden; }
    .bar > i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #236de9, #58a021);
      border-radius: 2px; transition: width .35s ease;
    }
    .status {
      margin-top: 12px; font-size: 12px; color: #8a959c;
      display: flex; justify-content: space-between; align-items: center;
    }
    .status .pct { font-variant-numeric: tabular-nums; color: #6b767d; }

    .error {
      display: none; margin-top: 20px; padding: 14px 16px;
      background: rgba(224, 68, 59, .1); border: 1px solid rgba(224, 68, 59, .35);
      border-radius: 10px; font-size: 12.5px; color: #f0a9a4;
    }
    .error.show { display: block; }
    .error .why { color: #e8edf0; margin-bottom: 4px; font-weight: 600; }
    .error .what { color: #b9c2c8; margin-bottom: 12px; }
    .error button {
      background: #236de9; color: #fff; border: 0; border-radius: 7px;
      padding: 6px 14px; font-size: 12px; cursor: pointer;
    }
    .error button:hover { background: #1b5cc4; }
    .hint { margin-top: 18px; font-size: 11.5px; color: #4e585f; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span><span class="name">酷炫后台管理</span></div>
    <h1>正在启动服务</h1>
    <p class="sub">首次启动需要初始化数据库，请稍候。这个过程只需一次。</p>

    <ul class="steps" id="steps">
      <li class="step" data-step="1"><span class="mark">1</span>检查运行环境</li>
      <li class="step" data-step="2"><span class="mark">2</span>初始化数据库</li>
      <li class="step" data-step="3"><span class="mark">3</span>启动缓存服务</li>
      <li class="step" data-step="4"><span class="mark">4</span>启动后台服务</li>
      <li class="step" data-step="5"><span class="mark">5</span>准备访问入口</li>
    </ul>

    <div class="bar"><i id="bar"></i></div>
    <div class="status">
      <span id="text">正在准备…</span>
      <span class="pct" id="pct">0%</span>
    </div>

    <div class="error" id="error">
      <div class="why" id="errWhy">启动失败</div>
      <div class="what" id="errWhat"></div>
      <button onclick="window.__openLog && window.__openLog()">打开日志目录</button>
    </div>

    <p class="hint">启动时间取决于电脑性能，通常 10 秒到 1 分钟。</p>
  </div>

  <script>
    // 供主进程调用：更新到第几步
    window.__setStep = function (step, text) {
      document.querySelectorAll('.step').forEach(function (el) {
        var n = Number(el.dataset.step)
        el.classList.toggle('active', n === step)
        el.classList.toggle('done', n < step)
        el.classList.remove('failed')
      })
      var pct = Math.round(((step - 1) / 5) * 100)
      document.getElementById('bar').style.width = pct + '%'
      document.getElementById('pct').textContent = pct + '%'
      if (text) document.getElementById('text').textContent = text
    }
    window.__finish = function () {
      document.querySelectorAll('.step').forEach(function (el) {
        el.classList.remove('active'); el.classList.add('done')
      })
      document.getElementById('bar').style.width = '100%'
      document.getElementById('pct').textContent = '100%'
      document.getElementById('text').textContent = '启动完成'
    }
    window.__fail = function (why, what) {
      var active = document.querySelector('.step.active')
      if (active) { active.classList.remove('active'); active.classList.add('failed') }
      document.getElementById('errWhy').textContent = why
      document.getElementById('errWhat').textContent = what
      document.getElementById('error').classList.add('show')
      document.getElementById('text').textContent = '启动失败'
    }
  </script>
</body>
</html>
